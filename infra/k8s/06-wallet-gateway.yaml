# wallet-gateway — единственный сервис, наружу открытый (см. compose.yaml,
# "это и есть адрес, который открывать в браузере"). Секретов не несёт (ни
# паролей, ни ключей — только адреса других сервисов), поэтому обычный
# Secret/generate-скрипт ему не нужен, все значения — прямо в env: ниже,
# как и в compose.yaml.
apiVersion: v1
kind: Service
metadata:
  name: wallet-gateway
  namespace: wallet-transaction
spec:
  # NodePort — чтобы открыть в браузере с локальной машины без Ingress
  # (minikube: `minikube service wallet-gateway -n wallet-transaction`;
  # kind: нужен extraPortMapping при создании кластера либо
  # `kubectl port-forward`, см. infra/k8s/README.md). nodePort зафиксирован, чтобы
  # адрес не менялся между пересозданиями.
  type: NodePort
  selector:
    app: wallet-gateway
  ports:
    - port: 8090
      targetPort: 8090
      nodePort: 30809
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-gateway
  namespace: wallet-transaction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-gateway
  template:
    metadata:
      labels:
        app: wallet-gateway
    spec:
      initContainers:
        # depends_on: {google-auth, wallet-api, wallet-report, wallet-web}:
        # service_healthy в compose.yaml — ждём не просто открытый порт
        # (nc -z), а реальную готовность апстрима (его собственный /healthz,
        # у wallet-web — /, своего /healthz у статики нет); busybox уже
        # содержит wget.
        - name: wait-for-google-auth
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "until wget -q -O /dev/null http://google-auth:8080/healthz; do sleep 2; done"]
        - name: wait-for-wallet-api
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "until wget -q -O /dev/null http://wallet-api:8082/healthz; do sleep 2; done"]
        - name: wait-for-wallet-report
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "until wget -q -O /dev/null http://wallet-report:8084/healthz; do sleep 2; done"]
        - name: wait-for-wallet-web
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "until wget -q -O /dev/null http://wallet-web:80/; do sleep 2; done"]
      containers:
        - name: wallet-gateway
          image: wallet-transaction/wallet-gateway:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "8090" }
            - { name: AUTH_SERVICE_URL, value: "http://google-auth:8080" }
            - { name: WALLET_API_URL, value: "http://wallet-api:8082" }
            - { name: WALLET_REPORT_API_URL, value: "http://wallet-report:8084" }
            - { name: WALLET_AI_URL, value: "http://wallet-ai:8087" }
            - { name: WALLET_WEB_URL, value: "http://wallet-web:80" }
          ports:
            - containerPort: 8090
          # httpGet /healthz — отдаётся самим гейтвеем, не проксируется на
          # апстримы (см. src/docs.cpp), тот же эндпоинт, что и healthcheck
          # в compose.yaml.
          readinessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 10
            periodSeconds: 10
