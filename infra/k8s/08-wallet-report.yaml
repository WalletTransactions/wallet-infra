# wallet-report — CQRS-lite query-сторона, выделенная из wallet-api 2026-09-08
# (см. compose.yaml и README wallet-report, "История"). Секрет
# wallet-report-env (REPORTS_DATABASE_URL уже с хостом "db", остальное — как
# в wallet-report/.env) создаёт infra/k8s/apply.sh из wallet-report/.env —
# см. infra/k8s/README.md. Никакого DATABASE_URL с правом писать в этом
# секрете нет вовсе — соединение только ролью wallet_reader (см. compose.yaml).
#
# Образ: соберите и загрузите в кластер СВОИМИ руками перед apply (см.
# infra/k8s/README.md, "Сборка образов") — этот файл его не собирает.
apiVersion: v1
kind: Service
metadata:
  name: wallet-report
  namespace: wallet-transaction
spec:
  selector:
    app: wallet-report
  ports:
    - port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-report
  namespace: wallet-transaction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-report
  template:
    metadata:
      labels:
        app: wallet-report
    spec:
      initContainers:
        # depends_on.db.condition: service_healthy в compose.yaml.
        - name: wait-for-db
          image: docker.io/library/postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h db -p 5432; do sleep 2; done"]
        # depends_on.google-auth.condition: service_healthy в compose.yaml —
        # wallet-report тянет JWKS с google-auth при старте (см. его README),
        # и ждём не просто открытый порт (nc -z), а реальную готовность
        # (httplib слушает и Postgres-подключение в его main() отработало) —
        # busybox уже содержит wget.
        - name: wait-for-google-auth
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "until wget -q -O /dev/null http://google-auth:8080/healthz; do sleep 2; done"]
      containers:
        - name: wallet-report
          image: wallet-transaction/wallet-report:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: wallet-report-env
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "8084" }
            - { name: AUTH_SERVICE_URL, value: "http://google-auth:8080" }
          ports:
            - containerPort: 8084
          # httpGet /healthz — тот же эндпоинт, что и healthcheck в
          # compose.yaml (см. src/docs.cpp: handle_healthz), не проверяет
          # reports_db отдельно.
          readinessProbe:
            httpGet: { path: /healthz, port: 8084 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8084 }
            initialDelaySeconds: 10
            periodSeconds: 10
