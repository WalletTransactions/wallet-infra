# wallet-telegram — Telegram-бот (см. compose.yaml и wallet-telegram/README.md).
# Секрет wallet-telegram-env (TELEGRAM_BOT_TOKEN, TELEGRAM_SERVICE_SECRET,
# TELEGRAM_TOKEN_ENC_KEY, ... и DATABASE_URL уже с хостом "db") создаёт
# infra/k8s/apply.sh из wallet-telegram/.env.
#
# replicas: 1 и strategy Recreate — обязательно: getUpdates у одного токена
# может вести только один процесс, второй получит 409 Conflict. RollingUpdate
# на время выката держал бы два пода.
#
# Service не нужен: входящих запросов нет, /metrics Prometheus в кластере
# (если появится) заберёт по аннотациям пода.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-telegram
  namespace: wallet-transaction
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wallet-telegram
  template:
    metadata:
      labels:
        app: wallet-telegram
    spec:
      terminationGracePeriodSeconds: 35
      initContainers:
        - name: wait-for-db
          image: docker.io/library/postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h db -p 5432; do sleep 2; done"]
        - name: wait-for-google-auth
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "until wget -q -O /dev/null http://google-auth:8080/healthz; do sleep 2; done"]
      containers:
        - name: wallet-telegram
          image: wallet-transaction/wallet-telegram:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: wallet-telegram-env
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "8086" }
            - { name: AUTH_SERVICE_URL, value: "http://google-auth:8080" }
            - { name: WALLET_REPORT_URL, value: "http://wallet-report:8084" }
            - { name: WALLET_API_URL, value: "http://wallet-api:8082" }
            # ИИ в кластере выключен (LLM нет): wallet-ai ответит 503 — бот
            # сразу работает строгим форматом.
            - { name: WALLET_AI_URL, value: "http://wallet-ai:8087" }
          ports:
            - containerPort: 8086
          readinessProbe:
            httpGet: { path: /healthz, port: 8086 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8086 }
            initialDelaySeconds: 10
            periodSeconds: 10
