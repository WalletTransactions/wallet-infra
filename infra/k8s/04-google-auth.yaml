# google-auth. Секрет google-auth-env (GOOGLE_CLIENT_ID/SECRET, REDIRECT_URL,
# DATABASE_URL уже с реальным паролем и хостом "db", ADMIN_EMAILS,
# COOKIE_SECURE, JWT_RSA_PRIVATE_KEY_PATH и т.д.) и секрет
# google-auth-jwt-key (сам PEM-файл) создаёт infra/k8s/apply.sh из
# google-auth/.env и google-auth/jwt_signing_key.pem — см. infra/k8s/README.md.
#
# Образ: соберите и загрузите в кластер СВОИМИ руками перед apply (см.
# infra/k8s/README.md, "Сборка образов") — этот файл его не собирает.
apiVersion: v1
kind: Service
metadata:
  name: google-auth
  namespace: wallet-transaction
spec:
  selector:
    app: google-auth
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: google-auth
  namespace: wallet-transaction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: google-auth
  template:
    metadata:
      labels:
        app: google-auth
    spec:
      initContainers:
        # Аналог depends_on.db.condition: service_healthy в compose.yaml —
        # redis тоже (compose требует service_healthy для обоих).
        - name: wait-for-db
          image: docker.io/library/postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h db -p 5432; do sleep 2; done"]
        - name: wait-for-redis
          image: docker.io/library/redis:7-alpine
          command: ["sh", "-c", "until redis-cli -h redis ping; do sleep 2; done"]
      containers:
        - name: google-auth
          image: wallet-transaction/google-auth:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: google-auth-env
          env:
            # Неcекретные адреса контейнерной сети — как в compose.yaml,
            # у сервиса "google-auth" (тот же приём, что явные overrides
            # там же). `env:` побеждает одноимённые ключи из envFrom.
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "8080" }
            - { name: REDIS_HOST, value: "redis" }
            - { name: REDIS_PORT, value: "6379" }
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: jwt-key
              mountPath: /app/jwt_signing_key.pem
              subPath: jwt_signing_key.pem
              readOnly: true
          # httpGet /healthz — тот же эндпоинт, что и healthcheck в
          # compose.yaml (см. src/docs.cpp: handle_healthz); не tcpSocket —
          # порт может слушаться раньше, чем Postgres/Redis-подключение из
          # main() отработает и httplib реально готов отвечать.
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: jwt-key
          secret:
            secretName: google-auth-jwt-key
