# Redis — активные access/refresh-токены google-auth (см. его README,
# "Персистентность"). AOF + PVC ОБЯЗАТЕЛЬНЫ по той же причине, что и в
# compose.yaml: без персистентности пересоздание pod'а стирает разом
# 30-дневные refresh-токены всех пользователей.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: wallet-transaction
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: wallet-transaction
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: wallet-transaction
spec:
  replicas: 1
  strategy:
    type: Recreate # тот же RWO-volume, что и у db — второй pod с ним не встанет
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
