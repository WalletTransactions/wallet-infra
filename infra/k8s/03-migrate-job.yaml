# Накат схемы (см. infra/db/README.md "Миграции") — версионированные .sql из
# {google-auth,wallet-api}/migrations, тем же инструментом (golang-migrate), что и
# infra/db/migrate.sh, но НЕ через сам migrate.sh — он ищет запущенный podman-
# контейнер "db" по compose-лейблу и подключается к его bridge-сети
# напрямую (см. сам скрипт), что в кубере не работает и не нужно: тут есть
# нормальный Service "db" с DNS-именем.
#
# ConfigMap'ы migrate-auth-sql/migrate-wallet-sql создаёт infra/k8s/apply.sh из
# {google-auth,wallet-api}/migrations/*.sql (те же 2 файла на базу, что и сейчас) —
# по той же причине, что и db-init-script в 01-db.yaml: самостоятельные
# файлы, не копия внутри YAML.
#
# Jobs одноразовые: apply.sh пересоздаёт их (delete --ignore-not-found,
# затем create) при каждом запуске — поле spec.template у Job неизменяемо,
# "kubectl apply" поверх уже отработавшего Job с новыми файлами миграций
# ничего не накатит сам. Так и должно быть: накат — явный шаг после
# "поднять db" и перед "поднять google-auth/wallet-api" (см. infra/db/README.md),
# не часть обычного apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate-auth
  namespace: wallet-transaction
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: docker.io/library/postgres:16-alpine
          env:
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: db-credentials, key: MIGRATOR_POSTGRES_USER } }
          command: ["sh", "-c", "until pg_isready -h db -p 5432 -U \"$PGUSER\"; do sleep 2; done"]
      containers:
        - name: migrate
          image: docker.io/migrate/migrate:v4
          env:
            - name: MIGRATOR_POSTGRES_USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: MIGRATOR_POSTGRES_USER } }
            - name: MIGRATOR_POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: MIGRATOR_POSTGRES_PASSWORD } }
            - name: AUTH_POSTGRES_DB
              valueFrom: { secretKeyRef: { name: db-credentials, key: AUTH_POSTGRES_DB } }
          args:
            - "-path=/migrations"
            - "-database=postgres://$(MIGRATOR_POSTGRES_USER):$(MIGRATOR_POSTGRES_PASSWORD)@db:5432/$(AUTH_POSTGRES_DB)?sslmode=disable"
            - "up"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: migrate-auth-sql
