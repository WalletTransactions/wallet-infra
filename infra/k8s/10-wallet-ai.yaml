# wallet-ai — LLM-функции (org/docs/TODO_wallet_ai.md). В кластере LLM пока
# нет (LM Studio живёт на хосте разработчика), поэтому LLM_URL не задан:
# сервис стартует с выключенным ИИ, /api/ai/status отвечает enabled=false.
# Отдельный под llama-server с GPU — когда понадобится; тогда LLM_URL/
# LLM_MODEL сюда и секрет с LLM_API_KEY. Секретов сейчас нет.
#
# Образ: соберите и загрузите в кластер СВОИМИ руками перед apply (см.
# infra/k8s/README.md, "Сборка образов").
apiVersion: v1
kind: Service
metadata:
  name: wallet-ai
  namespace: wallet-transaction
spec:
  selector:
    app: wallet-ai
  ports:
    - port: 8087
      targetPort: 8087
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-ai
  namespace: wallet-transaction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-ai
  template:
    metadata:
      labels:
        app: wallet-ai
    spec:
      initContainers:
        # depends_on.google-auth.condition: service_healthy в compose.yaml —
        # JWKS тянется при старте.
        - name: wait-for-google-auth
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "until wget -q -O /dev/null http://google-auth:8080/healthz; do sleep 2; done"]
      containers:
        - name: wallet-ai
          image: wallet-transaction/wallet-ai:local
          imagePullPolicy: IfNotPresent
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "8087" }
            - { name: AUTH_SERVICE_URL, value: "http://google-auth:8080" }
            - { name: WALLET_REPORT_URL, value: "http://wallet-report:8084" }
          ports:
            - containerPort: 8087
          readinessProbe:
            httpGet: { path: /healthz, port: 8087 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8087 }
            initialDelaySeconds: 10
            periodSeconds: 10
