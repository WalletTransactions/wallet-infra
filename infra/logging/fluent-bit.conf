# Читает journald хоста и льёт в OpenSearch.
#
# Почему через journald, а не push-драйвер (fluentd/gelf): не привязываться
# к конкретному драйверу каждого сервиса compose.yaml (пришлось бы добавлять
# logging.driver=fluentd + опции адреса в каждый сервис и держать это в
# синхроне) — вместо этого каждый сервис из вайтлиста ниже один раз получил
# `logging: driver: journald` (см. compose.yaml), а весь разбор/фильтрация
# сосредоточены здесь, в одном месте.
#
# Docker пишет journald-запись на КАЖДУЮ строку stdout/stderr контейнера от
# имени процесса самого демона — отсюда `_COMM=dockerd` в фильтре ниже
# (проверьте после первого запуска: `journalctl _COMM=dockerd -n 5`; если
# демон запущен нестандартно и пишет под другим именем — поправьте здесь).
# Поля CONTAINER_NAME/CONTAINER_ID/CONTAINER_ID_FULL/SYSLOG_IDENTIFIER/
# PRIORITY Docker проставляет сам, без доп. настройки.

[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name             systemd
    Tag              docker.*
    Path             /var/log/journal
    Read_From_Tail   On
    # Все stdout/stderr контейнеров с logging.driver=journald (см. compose.yaml)
    # Docker пишет в journald от имени процесса dockerd — см. комментарий выше.
    Systemd_Filter    _COMM=dockerd

# Сужаем до контейнеров двух контуров — иначе в индекс попадут контейнеры
# любых других compose-стеков на этом же хосте, если им тоже включат
# logging.driver=journald. Префикс — имя compose-проекта контура:
# wallet-prod или wallet-test (`name: wallet-${WALLET_ENV}` в
# wallet-infra/compose.yaml). Меняете имя проекта там — меняйте префикс и здесь,
# иначе фильтр молча дропнет все логи ("No matching indices found:
# wallet-logs*" в Dashboards — так уже было при смене имени каталога).
#
# Дальше — явный whitelist по сервисам, а не просто "все контейнеры
# контура": нужны прикладные сервисы и db/redis. Сами стеки логов и метрик —
# отдельные проекты (wallet-logging, wallet-monitoring), под префикс не
# подпадают и journald-драйвер не включают.
[FILTER]
    Name    grep
    Match   docker.*
    Regex   CONTAINER_NAME ^wallet-(prod|test)[-_](db|redis|google-auth|wallet-api|wallet-report|wallet-web|wallet-gateway|wallet-telegram|wallet-ai)[-_]

[FILTER]
    Name    modify
    Match   docker.*
    Rename  CONTAINER_NAME container_name
    Rename  MESSAGE        message

# Поле env — контур (prod/test) по префиксу контейнера: в Dashboards это
# фильтр env:test / env:prod поверх одного индекса wallet-logs-* (design D11
# в openspec/changes/add-prod-test-environments).
[FILTER]
    Name       modify
    Match      docker.*
    Condition  Key_value_matches container_name ^wallet-prod[-_]
    Add        env prod

[FILTER]
    Name       modify
    Match      docker.*
    Condition  Key_value_matches container_name ^wallet-test[-_]
    Add        env test

# Прикладные сервисы (google-auth, wallet-api, wallet-report, wallet-gateway) пишут структурные
# JSON-логи одной строкой в message (level/msg/service/trace_id/ts) — распаковываем
# их в отдельные поля индекса, а не гоняем как один нечитаемый blob. Reserve_Data On —
# сохраняет остальные поля записи (container_name и т.п.), Preserve_Key Off — сырой
# message после успешного разбора не нужен, удаляем (см. задачу). Поле "ts" парсер
# app_json (см. parsers.conf) забирает как время события и оно же становится
# "@timestamp" документа — отдельно в записи не остаётся. Если разбор не удался
# (не-JSON лог, например от db/redis) — фильтр запись не трогает, message остаётся
# как есть, ничего не теряется.
[FILTER]
    Name         parser
    Match        docker.*
    Key_Name     message
    Parser       app_json
    Reserve_Data On
    Preserve_Key Off

# Служебные journald-поля (обвязка dockerd/systemd: _CMDLINE, _CAP_EFFECTIVE,
# _SYSTEMD_CGROUP и т.п.) для приложения бесполезны, только засоряют индекс.
# Remove_wildcard "_" убирает разом все поля с подчёркивания (таких
# большинство), остальные — точечно.
[FILTER]
    Name            modify
    Match           docker.*
    Remove_wildcard _
    Remove          CODE_FILE
    Remove          CODE_LINE
    Remove          CODE_FUNC
    Remove          CONTAINER_ID_FULL
    Remove          CONTAINER_ID
    Remove          SYSLOG_IDENTIFIER
    Remove          PRIORITY

# Дневные индексы wallet-logs-YYYY.MM.DD (дата — UTC-время записи), а не один
# статичный wallet-logs: так ротация — это просто удаление целого индекса
# ISM-политикой wallet-logs-retention через 14 дней (см. opensearch-init.sh,
# ism_policy.json). Index pattern "wallet-logs*" в saved_objects.ndjson их
# уже покрывает.
[OUTPUT]
    Name                 opensearch
    Match                docker.*
    Host                 opensearch
    Port                 9200
    Logstash_Format      On
    Logstash_Prefix      wallet-logs
    Suppress_Type_Name   On
    tls                  Off
