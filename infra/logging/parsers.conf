# Свой parsers.conf, а не встроенный /fluent-bit/etc/parsers.conf из образа:
# образ fluent/fluent-bit:3.1 — минимальный (без shell/cat/ls, только сам
# бинарник), заглянуть внутрь и свериться нельзя, поэтому не полагаемся на
# то, что там сейчас есть парсер "json" с нужными нам опциями, а держим
# свой явно в репозитории.
#
# Time_Key/Time_Format — берём "@timestamp" документа из поля "ts", которое
# сервисы сами пишут в JSON (момент события внутри приложения), а не из
# момента, когда fluent-bit вычитал строку из journald (INPUT systemd) —
# они отличаются на доли секунды, но "ts" точнее и это единственное время,
# по которому имеет смысл сортировать/группировать в Dashboards. Формат —
# буквально то, что пишет приложение: "2026-09-03T20:04:15.111Z" (миллисекунды,
# литеральная "Z", не смещение %z). Output opensearch кладёт это внутреннее
# время в "@timestamp" по умолчанию (Time_Key там не переопределён). Time_Keep
# Off — поле "ts" после использования не дублируем в документе.
[PARSER]
    Name        app_json
    Format      json
    Time_Key    ts
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   Off
