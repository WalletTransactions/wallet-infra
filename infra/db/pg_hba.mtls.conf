# pg_hba для контура с WALLET_INTERNAL_MTLS=true (change add-internal-mtls, задача 9.1, design D7).
# Подключается compose.mtls.yaml через -c hba_file=…; без режима файл не используется и Postgres читает
# pg_hba.conf из каталога данных, который этот файл не меняет (откат — выключить режим, `up.sh`).
#
# local — сокет внутри контейнера: init-db.sh, healthcheck (pg_isready), docker exec psql, test-refresh.
# hostssl … scram — сервисы, экспортёры, миграции и администратор с хоста (127.0.0.1:<порт> проброшен
#   через docker, адрес клиента — шлюз сети): только по TLS и по паролю роли.
# hostnossl … reject — всё остальное без TLS отклоняется, даже с верным паролем.
#
# Роли сервисов (спека internal-service-tls, задача 9.1) — clientcert=verify-ca: кроме пароля нужен
# сертификат, выпущенный CA контура (ssl_ca_file). Пару для libpq сервис получает из тома pg-client-keys
# (compose.mtls.yaml). Строки читаются сверху вниз: роль сервиса — до общей строки. migrator, dumper,
# postgres_exporter, perf_* и администратор — по паролю (общая строка).
local   all   all                    trust
hostssl all   google_auth,wallet_api,wallet_reader,wallet_ai,wallet_telegram,wallet_docs   0.0.0.0/0   scram-sha-256 clientcert=verify-ca
hostssl all   google_auth,wallet_api,wallet_reader,wallet_ai,wallet_telegram,wallet_docs   ::/0        scram-sha-256 clientcert=verify-ca
hostssl all   all   0.0.0.0/0        scram-sha-256
hostssl all   all   ::/0             scram-sha-256
hostnossl all all   0.0.0.0/0        reject
hostnossl all all   ::/0             reject
