# Конфиг Prometheus — источники метрик для дашбордов Grafana (см.
# infra/monitoring/grafana/dashboards/, compose.yaml — сервисы "prometheus"/
# "grafana"/"cadvisor"/"node-exporter"/"postgres-exporter"/"redis-exporter").
#
# scrape_interval 10s — тот же порядок, что и у healthcheck'ов сервисов в
# compose.yaml (тоже 10s): чаще незачем на dev-стенде, реже — дашборды в
# реальном времени выглядели бы дёрганными. evaluation_interval не задан —
# правил алертинга в этом стенде нет вовсе (см. README проекта — Grafana
# здесь для оперативного анализа человеком, не для автоматических алертов).
global:
  scrape_interval: 10s

scrape_configs:
  # Сам Prometheus — его собственные метрики о себе (scrape_duration,
  # число TSDB-серий и т.п.) — минимальная самопроверка "жив ли сборщик".
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # HTTP-сервисы проекта — каждый отдаёт RPS/latency-percentiles/errors на
  # /metrics (см. src/util/metrics.hpp в каждом сервисе). job (имя ниже)
  # отличает сервисы друг от друга, метка env — контур (prod/test, design D11
  # в openspec/changes/add-prod-test-environments). Цели — по alias'ам
  # <сервис>-<env>: Prometheus сидит в сетях обоих контуров, а обычные имена
  # (wallet-api, db, ...) внутри каждой сети одинаковые. Дашборды фильтруют
  # по env через переменную $env.
  - job_name: google-auth
    static_configs:
      - targets: ["google-auth-prod:8080"]
        labels: {env: prod}
      - targets: ["google-auth-test:8080"]
        labels: {env: test}
  - job_name: wallet-api
    static_configs:
      - targets: ["wallet-api-prod:8082"]
        labels: {env: prod}
      - targets: ["wallet-api-test:8082"]
        labels: {env: test}
  - job_name: wallet-report
    static_configs:
      - targets: ["wallet-report-prod:8084"]
        labels: {env: prod}
      - targets: ["wallet-report-test:8084"]
        labels: {env: test}
  - job_name: wallet-gateway
    static_configs:
      - targets: ["wallet-gateway-prod:8090"]
        labels: {env: prod}
      - targets: ["wallet-gateway-test:8090"]
        labels: {env: test}
  - job_name: wallet-telegram
    static_configs:
      - targets: ["wallet-telegram-prod:8086"]
        labels: {env: prod}
      - targets: ["wallet-telegram-test:8086"]
        labels: {env: test}
  - job_name: wallet-ai
    static_configs:
      - targets: ["wallet-ai-prod:8087"]
        labels: {env: prod}
      - targets: ["wallet-ai-test:8087"]
        labels: {env: test}
  # MCP-сервер: кроме HTTP-гистограммы — вызовы инструментов
  # (mcp_tool_calls_total{tool,result}, mcp_tool_duration_seconds) и обмены
  # токена в google-auth (mcp_token_exchange_total, mcp_token_cache_total) —
  # строка "wallet-mcp" в wallet-overview.json.
  - job_name: wallet-mcp
    static_configs:
      - targets: ["wallet-mcp-prod:8088"]
        labels: {env: prod}
      - targets: ["wallet-mcp-test:8088"]
        labels: {env: test}

  # CPU/RAM/сеть ПО КОНТЕЙНЕРАМ (container_cpu_usage_seconds_total,
  # container_memory_usage_bytes, container_network_{receive,transmit}_bytes_total,
  # см. дашборд "Containers") — единственный сборщик здесь, которому нужны
  # права на просмотр рантайма (cgroups/containers), не только на HTTP-порт
  # приложения, см. подробный комментарий у самого сервиса "cadvisor" в
  # compose.yaml про rootless-оговорки.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # CPU/RAM/сеть ПО ХОСТУ — Linux-хост, общий для всех контейнеров обоих
  # контуров; то же самое, что container-метрики выше дают ПО ОТДЕЛЬНОСТИ,
  # но суммарно. Метки env у хоста и контейнеров нет: cAdvisor видит
  # контейнер только по id.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # DB connections/DB latency — по экспортёру на контур (postgres-exporter-
  # prod/-test в compose.yaml); GRANT pg_monitor и pg_stat_statements — см.
  # infra/db/init-db.sh. --auto-discover-databases обходит все базы контура.
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter-prod:9187"]
        labels: {env: prod}
      - targets: ["postgres-exporter-test:9187"]
        labels: {env: test}

  # Активные access/refresh-токены google-auth (redis_connected_clients,
  # redis_memory_used_bytes, redis_commands_processed_total и т.п.) — см.
  # сервис "redis" в wallet-infra/compose.yaml, что именно тут хранится и почему с AOF.
  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter-prod:9121"]
        labels: {env: prod}
      - targets: ["redis-exporter-test:9121"]
        labels: {env: test}
