# Разовая настройка источника данных Grafana при старте контейнера (см.
# volumes у сервиса "grafana" в compose.yaml) — тот же приём, что
# dashboards-init делает для OpenSearch Dashboards руками через curl, но
# Grafana умеет провижининг из файла сама, без отдельного init-контейнера.
#
# isDefault — единственный ИЗ ДВУХ источников с этим флагом, только у
# Prometheus (панели дашборда wallet-overview.json не указывают datasource
# явно нигде, кроме uid — полагаются на дефолтный); perf-history.json ниже
# всюду ссылается на свой источник по uid явно, поэтому isDefault ему не
# нужен.
apiVersion: 1

datasources:
  - name: Prometheus
    # uid фиксирован (не автогенерируется) — дашборды в ../dashboards/*.json
    # ссылаются на него этой же строкой в каждой панели; автогенерируемый uid
    # был бы другим при пересоздании источника и рассинхронизировал бы их.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # История прогонов нагрузочного контура (test_run/test_result, см.
  # infra/db/migrations/perf/) — читается ролью perf_reader (SELECT-only,
  # заводится самой миграцией perf, не init-db.sh — см. её комментарий).
  # "postgres" — встроенный тип датасорса Grafana (core-плагин, ничего
  # доустанавливать не нужно). database — своя, отдельная от auth/wallet, но
  # тот же инстанс Postgres контура test, что и у остальных ролей.
  - name: Perf History
    uid: perf-history
    type: postgres
    # db-test — alias db контура test: нагрузочные прогоны и их история
    # живут только в test (loadtest в prod не ходит).
    url: db-test:5432
    database: perf_history
    user: perf_reader
    jsonData:
      sslmode: disable
      # 1600 = Postgres 16.x (см. pgvector/pgvector:pg16 у "db" в wallet-infra/compose.yaml) —
      # влияет только на то, какой диалект SQL-автодополнения/фич Grafana
      # предполагает, не на сам протокол подключения.
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      # Пароль — из окружения контейнера Grafana (Grafana раскрывает $VAR в
      # файлах провижининга): compose.yaml берёт его из db.env контура test
      # через up.sh, а infra/env/migrate.sh test perf выставляет тот же пароль
      # роли perf_reader после каждого наката (литерал из миграции
      # perf/000001_init.up.sql — только для локальной разработки).
      password: $PERF_READER_POSTGRES_PASSWORD
    editable: false
