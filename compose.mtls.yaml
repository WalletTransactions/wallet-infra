# Взаимный TLS внутри контура (change add-internal-mtls, design D2, D3, D5, D10).
#
# Второй файл compose: infra/env/lib.sh (env_compose) добавляет его ТОЛЬКО при
# WALLET_INTERNAL_MTLS=true в infra/env/<env>.env. Без режима этого файла нет
# в команде, и описание контура — compose.yaml — не меняется.
#
# Что даёт каждому сервису:
#   - переменные TLS_CERT, TLS_KEY, TLS_CA (читает wallet-common, net/tls): все
#     три заданы — сервер требует клиентский сертификат, клиент проверяет сервер;
#   - его пару (tls.crt, tls.key) и ca.pem — только read-only (design D3), из
#     generated/mtls/<сервис> (выпускает infra/env/mtls.sh, WALLET_MTLS_DIR);
#   - метку wallet.mtls-config (хэш сертификата): сертификат перевыпущен —
#     compose пересоздаёт этот контейнер, сервис читает файлы только на старте;
#   - healthcheck через curl с собственным сертификатом: в режиме порт не
#     отвечает без клиентского сертификата. Имя в URL — имя сервиса (оно в SAN);
#     127.0.0.1 в SAN нет.
#
# Режим включается целиком: у каждого образа должна быть метка org.wallet.mtls=1
# (infra/env/up.sh и deploy.sh проверяют, design D8). Сервисы получают поддержку
# по шагам change (tasks.md, группы 4–7), поэтому на практике режим включают
# после последнего из них.
#
# Postgres (группа 9, задачи 9.1–9.2): сервер `db` с ssl=on, pg_hba `hostssl … scram` +
# `hostnossl … reject` (infra/db/pg_hba.mtls.conf) и сертификатом контура; клиенты — sslmode=verify-full
# с проверкой сервера по CA контура. Клиентский сертификат роли пока не требуется (ключ на bind-mount не
# проходит проверку прав libpq/Postgres — tasks.md, 9.1). Redis (9.3) — исключение, см. README.
# Здесь пока нет: prometheus (группа 8). Входной порт гейтвея
# остаётся обычным HTTP — это граница контура (D9): у гейтвея mTLS на клиентской стороне и на
# втором слушателе GATEWAY_MTLS_PORT (/healthz, /metrics, /version), healthcheck прежний.
# wallet-web (nginx): `listen 80 ssl` с проверкой клиента, healthcheck — loopback 127.0.0.1:8081.

x-mtls-env: &mtls-env
  TLS_CERT: /etc/wallet-tls/tls.crt
  TLS_KEY: /etc/wallet-tls/tls.key
  TLS_CA: /etc/wallet-tls/ca.pem
  # Весь контур: сервер сервиса требует клиентский сертификат, а вызовы к другим сервисам идут
  # по https (без этой переменной TLS_* включают только mTLS к служебному порту google-auth).
  INTERNAL_MTLS: "true"

services:
  # google-auth: сертификат, TLS_* и метка — в compose.auth-mtls.yaml (подключается и при этом
  # режиме). Публичный порт остаётся обычным HTTP (гейтвей и JWKS, design D9), /internal/* — на
  # служебном :8443, а /healthz и /metrics — только по mTLS на отдельном порту :8442
  # (SERVICE_MTLS_PORT, google-auth не ниже 0.4.4; на публичном порту их нет).
  # wallet-telegram, wallet-mcp, wallet-ai: сертификаты, TLS_* и метки — там же; здесь —
  # INTERNAL_MTLS (сервер на mTLS, вызовы внутри контура по https) и healthcheck.
  google-auth:
    environment:
      SERVICE_MTLS_PORT: "8442"
      DATABASE_URL: postgresql://${AUTH_POSTGRES_USER}:${AUTH_POSTGRES_PASSWORD}@db:5432/${AUTH_POSTGRES_DB}?sslmode=verify-full&sslrootcert=/etc/wallet-tls/ca.pem
    healthcheck:
      test: !override ["CMD", "curl", "-f", "--cacert", "/etc/wallet-tls/ca.pem", "--cert", "/etc/wallet-tls/tls.crt", "--key", "/etc/wallet-tls/tls.key", "https://google-auth:8442/healthz"]

  wallet-api:
    environment:
      <<: *mtls-env
      DATABASE_URL: postgresql://${WALLET_POSTGRES_USER}:${WALLET_POSTGRES_PASSWORD}@db:5432/${WALLET_POSTGRES_DB}?sslmode=verify-full&sslrootcert=/etc/wallet-tls/ca.pem
    volumes:
      - ${WALLET_MTLS_DIR:?}/wallet-api:/etc/wallet-tls:ro
    labels:
      wallet.mtls-config: ${WALLET_MTLS_HASH_WALLET_API:?}
    healthcheck:
      test: !override ["CMD", "curl", "-f", "--cacert", "/etc/wallet-tls/ca.pem", "--cert", "/etc/wallet-tls/tls.crt", "--key", "/etc/wallet-tls/tls.key", "https://wallet-api:8082/healthz"]

  wallet-report:
    environment:
      <<: *mtls-env
      REPORTS_DATABASE_URL: postgresql://wallet_reader:${READER_POSTGRES_PASSWORD:?}@db:5432/${WALLET_POSTGRES_DB}?sslmode=verify-full&sslrootcert=/etc/wallet-tls/ca.pem
    volumes:
      - ${WALLET_MTLS_DIR:?}/wallet-report:/etc/wallet-tls:ro
    labels:
      wallet.mtls-config: ${WALLET_MTLS_HASH_WALLET_REPORT:?}
    healthcheck:
      test: !override ["CMD", "curl", "-f", "--cacert", "/etc/wallet-tls/ca.pem", "--cert", "/etc/wallet-tls/tls.crt", "--key", "/etc/wallet-tls/tls.key", "https://wallet-report:8084/healthz"]

  # Профиль docs (необязательный модуль): описание берётся из compose.yaml.
  wallet-docs:
    environment:
      <<: *mtls-env
      DATABASE_URL: postgresql://${DOCS_POSTGRES_USER-}:${DOCS_POSTGRES_PASSWORD-}@db:5432/${DOCS_POSTGRES_DB-}?sslmode=verify-full&sslrootcert=/etc/wallet-tls/ca.pem
    volumes:
      - ${WALLET_MTLS_DIR:?}/wallet-docs:/etc/wallet-tls:ro
    labels:
      wallet.mtls-config: ${WALLET_MTLS_HASH_WALLET_DOCS:?}
    healthcheck:
      test: !override ["CMD", "curl", "-f", "--cacert", "/etc/wallet-tls/ca.pem", "--cert", "/etc/wallet-tls/tls.crt", "--key", "/etc/wallet-tls/tls.key", "https://wallet-docs:8089/healthz"]

  # Входной порт — обычный HTTP (D9); mTLS только на клиентской стороне (к api,
  # report, ai, mcp, web), healthcheck прежний.
  wallet-gateway:
    environment:
      <<: *mtls-env
      # Второй слушатель: только /healthz, /metrics, /version по mTLS (для Prometheus, D9).
      GATEWAY_MTLS_PORT: 8443
    volumes:
      - ${WALLET_MTLS_DIR:?}/wallet-gateway:/etc/wallet-tls:ro
    labels:
      wallet.mtls-config: ${WALLET_MTLS_HASH_WALLET_GATEWAY:?}

  wallet-telegram:
    environment:
      INTERNAL_MTLS: "true"
      DATABASE_URL: postgresql://${TELEGRAM_POSTGRES_USER}:${TELEGRAM_POSTGRES_PASSWORD}@db:5432/${TELEGRAM_POSTGRES_DB}?sslmode=verify-full&sslrootcert=/etc/wallet-tls/ca.pem
    healthcheck:
      test: !override ["CMD", "curl", "-f", "--cacert", "/etc/wallet-tls/ca.pem", "--cert", "/etc/wallet-tls/tls.crt", "--key", "/etc/wallet-tls/tls.key", "https://wallet-telegram:8086/healthz"]

  wallet-mcp:
    environment:
      INTERNAL_MTLS: "true"
    healthcheck:
      test: !override ["CMD", "curl", "-f", "--cacert", "/etc/wallet-tls/ca.pem", "--cert", "/etc/wallet-tls/tls.crt", "--key", "/etc/wallet-tls/tls.key", "https://wallet-mcp:8088/healthz"]

  wallet-ai:
    environment:
      INTERNAL_MTLS: "true"
      DATABASE_URL: postgresql://${AI_POSTGRES_USER}:${AI_POSTGRES_PASSWORD}@db:5432/${AI_POSTGRES_DB}?sslmode=verify-full&sslrootcert=/etc/wallet-tls/ca.pem
    healthcheck:
      test: !override ["CMD", "curl", "-f", "--cacert", "/etc/wallet-tls/ca.pem", "--cert", "/etc/wallet-tls/tls.crt", "--key", "/etc/wallet-tls/tls.key", "https://wallet-ai:8087/healthz"]

  # nginx: слушатель `listen 80 ssl` с проверкой клиента выбирает entrypoint образа по
  # INTERNAL_MTLS; healthcheck — loopback-блок 127.0.0.1:8081 (design D5), снаружи недоступный.
  wallet-web:
    environment:
      INTERNAL_MTLS: "true"
    volumes:
      - ${WALLET_MTLS_DIR:?}/wallet-web:/etc/wallet-tls:ro
    labels:
      wallet.mtls-config: ${WALLET_MTLS_HASH_WALLET_WEB:?}
    healthcheck:
      test: !override ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]

  # Postgres (задача 9.1): TLS на сервере. Ключ Postgres принимает только у своего пользователя с правами
  # 0600, а на bind-mount он принадлежит хостовому пользователю — поэтому обёртка копирует пару в
  # каталог вне данных (пересоздаётся с контейнером) и отдаёт её postgres. Команда повторяет compose.yaml
  # (!override: список заменяется целиком) плюс ssl и свой pg_hba.
  db:
    entrypoint:
      - sh
      - -c
      - >-
        install -d -m 700 -o postgres -g postgres /var/lib/postgresql/tls &&
        install -m 600 -o postgres -g postgres /etc/wallet-tls/tls.key /var/lib/postgresql/tls/server.key &&
        install -m 644 -o postgres -g postgres /etc/wallet-tls/tls.crt /var/lib/postgresql/tls/server.crt &&
        exec docker-entrypoint.sh "$$@"
      - --
    command: !override
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - ${WALLET_MTLS_DIR:?}/db:/etc/wallet-tls:ro
      - ./infra/db/pg_hba.mtls.conf:/etc/postgresql/pg_hba.conf:ro
    labels:
      wallet.mtls-config: ${WALLET_MTLS_HASH_DB:?}
