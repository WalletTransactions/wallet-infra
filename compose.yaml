# Описание контура WalletTransactions — ОДНО на оба контура, prod и test
# (openspec/changes/add-prod-test-environments, design D1/D2). Контур — это
# compose-проект wallet-<env>; чем контуры отличаются, задают:
#   - infra/env/<env>.env — настройки контура в git (порт гейтвея,
#     oom_score_adj, LLM), без секретов;
#   - ~/.local/state/wallet-envs/<env>/tags.env — теги образов, пишет только
#     выкат (infra/env/deploy.sh);
#   - ~/.config/wallet-secrets/<env>/ — секреты, вне git (db.env с паролями
#     ролей Postgres, <сервис>.env, jwt_signing_key.pem).
#
# Запуск — ТОЛЬКО через скрипт, он подставляет все три источника:
#   bash infra/env/up.sh test
#   bash infra/env/up.sh prod
# Голый `docker compose up` в этом каталоге падает на первой же незаданной
# переменной (${VAR:?}) и ничего не создаёт — так и задумано: случайно
# поднять "контур без контура" или собрать образ из рабочей папки нельзя.
# Сборки (build:) здесь нет вовсе: образы собирает CI в ghcr по git-тегу
# сервиса (vX.Y.Z-rc.N → test, vX.Y.Z → prod, тот же digest).
#
# Роли Postgres на одном инстансе контура (подробно — infra/db/README.md):
#   - MIGRATOR_POSTGRES_USER — bootstrap-роль образа postgres (фактически
#     суперпользователь), единственная умеет DDL; ею накатываются миграции
#     (infra/env/migrate.sh);
#   - AUTH_/WALLET_/TELEGRAM_/AI_POSTGRES_* — роль и база на сервис, только DML;
#   - MONITORING_POSTGRES_* — pg_monitor для postgres-exporter;
#   - PERF_POSTGRES_* — база истории нагрузочных прогонов;
#   - DUMPER_POSTGRES_* — pg_read_all_data, только дампы (бэкап prod,
#     перезаливка test).
# Роли и базы заводит infra/db/init-db.sh при ПЕРВОМ старте пустого тома;
# таблицы — только миграции (сервисы падают на старте, если их забыли:
# db::Database::verify_schema()).
#
# Сеть контура wallet-<env> — external: её создаёт up.sh, чтобы стек метрик
# (infra/monitoring) мог к ней подключиться в любом порядке запуска. Внутри
# сети у сервисов обычные имена (db, google-auth, ...) для соседей и alias
# <сервис>-<env> для Prometheus, который сидит в сетях обоих контуров
# (design D11). На хост публикуется ТОЛЬКО гейтвей; к db/redis — docker exec.
#
# Логи — journald (logging ниже): Fluent Bit (infra/logging) берёт из него
# контейнеры с префиксом wallet-prod-/wallet-test- и ставит поле env.

name: wallet-${WALLET_ENV:?WALLET_ENV не задан — запускайте через infra/env/up.sh <env>}

# Общее для всех сервисов контура. oom_score_adj — кого ядро убивает первым
# при нехватке памяти хоста: test (500) раньше prod (-900), design D10.
x-service: &service
  restart: unless-stopped
  logging:
    driver: journald
  oom_score_adj: ${WALLET_OOM_ADJ:?}

services:
  db:
    <<: *service
    image: docker.io/library/postgres:16-alpine
    mem_limit: 384m
    # shared_preload_libraries — грузит pg_stat_statements в разделяемую
    # память кластера при старте postgres (CREATE EXTENSION в init-db.sh без
    # этого упал бы). track_io_timing — время чтения/записи блоков в
    # pg_stat_statements: отличить "медленный SQL" от "упёрлись в диск".
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    environment:
      # Слева — имена, которых требует сам образ postgres: bootstrap-пара
      # МИГРАТОРА. Остальное читает infra/db/init-db.sh, не Postgres.
      POSTGRES_USER: ${MIGRATOR_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${MIGRATOR_POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${MIGRATOR_POSTGRES_DB:?}
      AUTH_POSTGRES_USER: ${AUTH_POSTGRES_USER:?}
      AUTH_POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?}
      AUTH_POSTGRES_DB: ${AUTH_POSTGRES_DB:?}
      WALLET_POSTGRES_USER: ${WALLET_POSTGRES_USER:?}
      WALLET_POSTGRES_PASSWORD: ${WALLET_POSTGRES_PASSWORD:?}
      WALLET_POSTGRES_DB: ${WALLET_POSTGRES_DB:?}
      MONITORING_POSTGRES_USER: ${MONITORING_POSTGRES_USER:?}
      MONITORING_POSTGRES_PASSWORD: ${MONITORING_POSTGRES_PASSWORD:?}
      PERF_POSTGRES_USER: ${PERF_POSTGRES_USER:?}
      PERF_POSTGRES_PASSWORD: ${PERF_POSTGRES_PASSWORD:?}
      PERF_POSTGRES_DB: ${PERF_POSTGRES_DB:?}
      TELEGRAM_POSTGRES_USER: ${TELEGRAM_POSTGRES_USER:?}
      TELEGRAM_POSTGRES_PASSWORD: ${TELEGRAM_POSTGRES_PASSWORD:?}
      TELEGRAM_POSTGRES_DB: ${TELEGRAM_POSTGRES_DB:?}
      AI_POSTGRES_USER: ${AI_POSTGRES_USER:?}
      AI_POSTGRES_PASSWORD: ${AI_POSTGRES_PASSWORD:?}
      AI_POSTGRES_DB: ${AI_POSTGRES_DB:?}
      DUMPER_POSTGRES_USER: ${DUMPER_POSTGRES_USER:?}
      DUMPER_POSTGRES_PASSWORD: ${DUMPER_POSTGRES_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MIGRATOR_POSTGRES_USER} -d ${MIGRATOR_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      wallet:
        aliases: ["db-${WALLET_ENV}"]

  # Активные access- и refresh-токены google-auth (см. его README,
  # "Персистентность"). AOF + том обязательны: refresh-токены живут 30 дней,
  # без персистентности пересоздание контейнера разлогинило бы всех.
  # Без пароля: порт наружу не публикуется, доступ только из сети контура.
  redis:
    <<: *service
    image: docker.io/library/redis:7-alpine
    mem_limit: 64m
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      wallet:
        aliases: ["redis-${WALLET_ENV}"]

  google-auth:
    <<: *service
    image: ghcr.io/walletransactions/google-auth:${GOOGLE_AUTH_TAG:?}
    mem_limit: 64m
    env_file:
      - ${WALLET_SECRETS_DIR:?}/google-auth.env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql://${AUTH_POSTGRES_USER}:${AUTH_POSTGRES_PASSWORD}@db:5432/${AUTH_POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ${WALLET_SECRETS_DIR}/jwt_signing_key.pem:/app/jwt_signing_key.pem:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # GET /healthz — liveness самого процесса (src/docs.cpp: handle_healthz),
    # Postgres/Redis отдельно не проверяет. curl в рантайм-образе ради этой команды.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      wallet:
        aliases: ["google-auth-${WALLET_ENV}"]

  wallet-web:
    <<: *service
    image: ghcr.io/walletransactions/wallet-web:${WALLET_WEB_TAG:?}
    mem_limit: 32m
    # Никакого env_file — nginx статики не читает переменные окружения, а
    # сама статика не содержит секретов/адресов бекендов (см. README).
    # wget — busybox wget, уже есть в образе nginx:1.27-alpine. 127.0.0.1, не
    # localhost: "localhost" в этом образе резолвится только в ::1, а nginx
    # слушает только IPv4 (см. nginx.conf).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      wallet:
        aliases: ["wallet-web-${WALLET_ENV}"]

  wallet-api:
    <<: *service
    image: ghcr.io/walletransactions/wallet-api:${WALLET_API_TAG:?}
    mem_limit: 128m
    env_file:
      - ${WALLET_SECRETS_DIR}/wallet-api.env
    environment:
      HOST: 0.0.0.0
      PORT: 8082
      AUTH_SERVICE_URL: http://google-auth:8080
      DATABASE_URL: postgresql://${WALLET_POSTGRES_USER}:${WALLET_POSTGRES_PASSWORD}@db:5432/${WALLET_POSTGRES_DB}
    depends_on:
      google-auth:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      wallet:
        aliases: ["wallet-api-${WALLET_ENV}"]

  # CQRS-lite query-сторона (README wallet-report, "История"). ТА ЖЕ база,
  # что у wallet-api, но ролью wallet_reader — права писать в базу у
  # процесса нет вовсе, ни в коде, ни в конфигурации. Роль создаёт миграция
  # wallet-api с паролем-литералом для локальной разработки; в контуре
  # infra/env/migrate.sh после каждого наката базы wallet перезадаёт его
  # значением READER_POSTGRES_PASSWORD из db.env (свой у prod и test).
  wallet-report:
    <<: *service
    image: ghcr.io/walletransactions/wallet-report:${WALLET_REPORT_TAG:?}
    mem_limit: 64m
    env_file:
      - ${WALLET_SECRETS_DIR}/wallet-report.env
    environment:
      HOST: 0.0.0.0
      PORT: 8084
      AUTH_SERVICE_URL: http://google-auth:8080
      REPORTS_DATABASE_URL: postgresql://wallet_reader:${READER_POSTGRES_PASSWORD:?}@db:5432/${WALLET_POSTGRES_DB}
      # glibc заводит по арене malloc на поток, и каждая разрастается до пика
      # самого тяжёлого запроса (2026-09-22). Две арены + malloc_trim после
      # крупных ответов (src/main.cpp) держат RSS ровным.
      MALLOC_ARENA_MAX: "2"
    depends_on:
      google-auth:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8084/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      wallet:
        aliases: ["wallet-report-${WALLET_ENV}"]

  # LLM-функции (org/docs/TODO_wallet_ai.md): разбор трат текстом, импорт
  # выписок, чат. LLM — LM Studio на ХОСТЕ (GPU), host.docker.internal через
  # host-gateway. LLM_URL — из настроек контура: в prod LM Studio, в test
  # пусто (GPU один, design D8) — тогда /api/ai/status отвечает enabled=false.
  wallet-ai:
    <<: *service
    image: ghcr.io/walletransactions/wallet-ai:${WALLET_AI_TAG:?}
    mem_limit: 64m
    env_file:
      - ${WALLET_SECRETS_DIR}/wallet-ai.env
    environment:
      HOST: 0.0.0.0
      PORT: 8087
      AUTH_SERVICE_URL: http://google-auth:8080
      # Справочник счетов пользователя (его токеном) — при создании задания.
      WALLET_REPORT_URL: http://wallet-report:8084
      # Своя база ai — импорт выписок. Не отвечает — импорт выключен, трата
      # текстом работает.
      DATABASE_URL: postgresql://${AI_POSTGRES_USER}:${AI_POSTGRES_PASSWORD}@db:5432/${AI_POSTGRES_DB}
      LLM_URL: ${LLM_URL-}
      LLM_MODEL: ${LLM_MODEL-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      google-auth:
        condition: service_healthy
      wallet-report:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8087/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      wallet:
        aliases: ["wallet-ai-${WALLET_ENV}"]

  # Единственная точка входа контура на хосте: prod :8090, test :8091.
  wallet-gateway:
    <<: *service
    image: ghcr.io/walletransactions/wallet-gateway:${WALLET_GATEWAY_TAG:?}
    mem_limit: 64m
    env_file:
      - ${WALLET_SECRETS_DIR}/wallet-gateway.env
    environment:
      HOST: 0.0.0.0
      PORT: 8090
      AUTH_SERVICE_URL: http://google-auth:8080
      WALLET_API_URL: http://wallet-api:8082
      WALLET_REPORT_API_URL: http://wallet-report:8084
      WALLET_AI_URL: http://wallet-ai:8087
      WALLET_WEB_URL: http://wallet-web:80
    depends_on:
      google-auth:
        condition: service_healthy
      wallet-api:
        condition: service_healthy
      wallet-report:
        condition: service_healthy
      wallet-ai:
        condition: service_healthy
      wallet-web:
        condition: service_healthy
    # GET /healthz отдаётся самим гейтвеем, не проксируется на апстримы.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "${WALLET_GATEWAY_PORT:?}:8090"
    networks:
      wallet:
        aliases: ["wallet-gateway-${WALLET_ENV}"]

  # Telegram-бот (org/docs/TODO_telegram_bot.md): long polling до
  # api.telegram.org, входящих портов нет. К google-auth ходит напрямую
  # (/internal/telegram/exchange), не через гейтвей. Свой бот у каждого
  # контура (токен в секретах контура). Один экземпляр на токен — второй
  # получил бы 409; stop_grace_period — с запасом на текущий long poll
  # (TELEGRAM_POLL_TIMEOUT_SECS, 25 с), иначе SIGKILL посреди запроса.
  wallet-telegram:
    <<: *service
    image: ghcr.io/walletransactions/wallet-telegram:${WALLET_TELEGRAM_TAG:?}
    mem_limit: 64m
    stop_grace_period: 35s
    env_file:
      - ${WALLET_SECRETS_DIR}/wallet-telegram.env
    environment:
      HOST: 0.0.0.0
      PORT: 8086
      AUTH_SERVICE_URL: http://google-auth:8080
      WALLET_REPORT_URL: http://wallet-report:8084
      WALLET_API_URL: http://wallet-api:8082
      # Трата свободным текстом. Не отвечает — бот работает строгим
      # форматом, поэтому без depends_on.
      WALLET_AI_URL: http://wallet-ai:8087
      DATABASE_URL: postgresql://${TELEGRAM_POSTGRES_USER}:${TELEGRAM_POSTGRES_PASSWORD}@db:5432/${TELEGRAM_POSTGRES_DB}
    depends_on:
      google-auth:
        condition: service_healthy
      wallet-report:
        condition: service_healthy
      wallet-api:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8086/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      wallet:
        aliases: ["wallet-telegram-${WALLET_ENV}"]

networks:
  wallet:
    name: wallet-${WALLET_ENV}
    external: true

# Тома проекта: wallet-<env>_db-data, wallet-<env>_redis-data.
volumes:
  db-data:
  redis-data:
